<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from '/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sky = new THREE.Color('#b9c7d6');
scene.background = sky;
scene.fog = new THREE.Fog('#c3c9cf', 9000, 30000);

const hemi = new THREE.HemisphereLight('#e9eef5', '#3a4250', 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffe2bf', 2.4);
sun.position.set(-1800, 3200, 5600);
sun.target.position.set(3000, 0, 2500);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera;
sc.left = -4200; sc.right = 4200; sc.top = 3600; sc.bottom = -3600; sc.near = 100; sc.far = 14000;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// Agua
const water = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshStandardMaterial({ color: '#2f5f86', roughness: 0.55, metalness: 0.0 }));
water.rotation.x = -Math.PI / 2;
water.position.set(3000, -0.2, 2500);
water.receiveShadow = true;
scene.add(water);

// Montes alrededor (sierra norte, sur y valle este); al oeste, el mar
{
  const S = 26000, N = 260;
  const g = new THREE.PlaneGeometry(S, S, N, N);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  const col = [];
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + 3000, z = pos.getZ(i) + 2500;
    const dx = Math.max(0, -x, x - 6000), dz = Math.max(0, -z, z - 5000);
    let d = Math.hypot(dx, dz);
    let h = -30;
    if (d === 0) {
      const dd = Math.min(x, 6000 - x, z, 5000 - z);
      if (dd < 140 && x > 320 && !(x > 5700 && Math.abs(z - 2100) < 220)) h = 0.3;
    }
    if (d > 0) {
      const n = Math.sin(x / 700) * Math.cos(z / 900) * 0.5 + Math.sin(x / 260 + z / 330) * 0.25 + Math.sin(z / 1700 + x / 2100) * 0.4;
      h = Math.min(1, d / 2600) * (380 + 260 * n) + n * 30;
      // Valle de la ría al este (aguas arriba)
      if (x > 6000) h *= 1 - Math.exp(-((z - 2100) ** 2) / (2 * 260 ** 2)) * 0.95;
      // Mar al oeste
      if (x < 0) h = -40 - d * 0.02;
      else if (!(x > 6000 && Math.abs(z - 2100) < 160)) h = Math.max(1.5 + d * 0.01, h);
      // Colina del prólogo (al norte del Distrito Cero)
      h += 120 * Math.exp(-(((x - 4300) / 600) ** 2 + ((z + 700) / 450) ** 2));
    }
    pos.setY(i, h);
    if (h < 0.1 && (x < 0 || x > 5700)) c.set('#2f5f86');
    else if (h < 2) c.set('#4c6142');
    else if (h < 60) c.set('#4c6142');
    else if (h < 300) c.set('#3d5236').lerp(new THREE.Color('#5a5f4a'), (h - 60) / 240);
    else c.set('#6b6a60').lerp(new THREE.Color('#9a958a'), Math.min(1, (h - 300) / 300));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
  m.position.set(3000, 0, 2500);
  m.receiveShadow = true;
  scene.add(m);
}

const data = await (await fetch('./city.json')).json();
const geos = [];
const tmp = new THREE.Color();
const path = (P, r) => { for (let i = 0; i < r.length; i += 2) { const x = r[i], y = -r[i + 1]; if (i === 0) P.moveTo(x, y); else P.lineTo(x, y); } return P; };
for (const [h, base, colHex, rings] of data.items) {
  const sh = path(new THREE.Shape(), rings[0]);
  for (const r of rings.slice(1)) sh.holes.push(path(new THREE.Path(), r));
  const g = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: false, curveSegments: 1 });
  g.rotateX(-Math.PI / 2);
  if (base) g.translate(0, base, 0);
  const n = g.attributes.position.count;
  tmp.set(colHex);
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = tmp.r; arr[i * 3 + 1] = tmp.g; arr[i * 3 + 2] = tmp.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  geos.push(g.index ? g.toNonIndexed() : g);
}
const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0.0 });
for (let i = 0; i < geos.length; i += 3000) {
  const merged = mergeGeometries(geos.slice(i, i + 3000), false);
  merged.computeVertexNormals();
  const m = new THREE.Mesh(merged, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// Luces de la torre y de la ciudad (puntos emisivos)
const beacon = new THREE.Mesh(new THREE.SphereGeometry(9, 12, 8), new THREE.MeshBasicMaterial({ color: '#ff3b3b' }));
beacon.position.set(3000, 186, 2210);
scene.add(beacon);

const camera = new THREE.PerspectiveCamera(38, W / H, 5, 40000);
const VIEWS = {
  ciudad: { pos: [-1700, 2900, 7900], look: [3150, 0, 2350], fov: 38 },
  isla: { pos: [5600, 520, 650], look: [2800, 40, 2350], fov: 42 },
  ria: { pos: [-350, 330, 3650], look: [1500, 0, 2350], fov: 46 },
  sur: { pos: [4300, 700, 6400], look: [3600, 0, 3800], fov: 44 },
};
window.view = (name) => {
  const v = VIEWS[name];
  camera.fov = v.fov;
  camera.updateProjectionMatrix();
  camera.position.set(...v.pos);
  camera.lookAt(...v.look);
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body></html>
